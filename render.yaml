services:
  - type: web
    name: video-downloader-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: /
    autoDeploy: true